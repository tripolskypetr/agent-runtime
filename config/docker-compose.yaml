# agent-runtime on another machine: only Docker is required.
#
#   mkdir agent-runtime && cd agent-runtime
#   curl -O https://raw.githubusercontent.com/tripolskypetr/agent-runtime/master/config/docker-compose.yaml
#   curl -o .env https://raw.githubusercontent.com/tripolskypetr/agent-runtime/master/config/.env.example
#   # put your key from https://ollama.com/settings/keys into .env (OLLAMA_API_KEY=...)
#   docker compose up -d
#
#   Swagger:  http://localhost:10050/docs
#   Admin UI: http://localhost:10050/admin
#   curl -X POST http://localhost:10050/api/v1/inference -H 'content-type: application/json' -d @request.json
#
# Update to the latest image:  docker compose pull && docker compose up -d

services:
  agent-runtime:
    image: tripolskypetr/agent-runtime:latest
    # the image is published for linux/amd64 only; this lets `docker compose pull` work on arm64 hosts (Apple Silicon) via emulation
    platform: linux/amd64
    container_name: agent-runtime
    ports:
      - "10050:10050"
    env_file:
      - .env
    environment:
      # Everything below can be overridden in .env; these are the defaults baked into the image.
      - PORT=10050
      - DATA_DIR=/app/data
      - DB_PATH=/app/storage/agent-runtime.sqlite
      - LOGS_DIR=/app/logs
      # everything from ./logs/debug.log is also printed to stdout, so `docker compose logs -f agent-runtime` shows it
      - LOG_CONSOLE=all
    volumes:
      # SQLite database with the history of inferences, transcripts and files
      - ./storage:/app/storage
      # Debug log: ./logs/debug.log (JSON lines, rotated at 100 MB) — read it first when something goes wrong
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10050/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # To use a local Ollama instead of ollama.com, run it on the host and set in .env:
  #   OLLAMA_HOST=http://host.docker.internal:11434
  #   OLLAMA_API_KEY=
  # and uncomment:
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
