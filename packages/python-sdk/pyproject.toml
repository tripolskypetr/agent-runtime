[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-client"
version = "0.2.0"
description = "Python client for agent-runtime over the standard library: generate_object() with answers validated against a full JSON Schema, generate_text(), and the admin API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Petr Tripolsky", email = "tripolskypetr@gmail.com" }]
keywords = ["agent-runtime", "sdk", "client", "ai-agent", "ollama", "structured-output", "json-schema", "generateObject", "generateText"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
unicode = ["regex>=2024.4.16"]

[project.urls]
Homepage = "https://github.com/tripolskypetr/agent-runtime/tree/master/packages/python-sdk#readme"
Repository = "https://github.com/tripolskypetr/agent-runtime"
Issues = "https://github.com/tripolskypetr/agent-runtime/issues"
Server = "https://github.com/tripolskypetr/agent-runtime"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_runtime_client = ["py.typed"]
